<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do List BD - Offline Task Manager</title>
<meta name="description" content="Offline bilingual EN/Bangla to-do list: priorities, due dates, overdue tracking, search, export/import. Your tasks stay in your browser.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div>
      <h1 data-i18n="appTitle">To-Do List BD</h1>
      <p class="tagline" data-i18n="tagline">Simple offline task list for everyday life.</p>
    </div>
    <button id="langBtn" class="lang-btn" type="button">&#2474;&#2494;&#2434;&#2482;&#2494;</button>
  </div>
</header>

<main class="wrap">
  <section class="stats" aria-label="Summary">
    <div class="stat"><span class="stat-num" id="statTotal">0</span><span class="stat-label" data-i18n="total">Total</span></div>
    <div class="stat"><span class="stat-num" id="statDone">0</span><span class="stat-label" data-i18n="completed">Completed</span></div>
    <div class="stat"><span class="stat-num" id="statPending">0</span><span class="stat-label" data-i18n="pendingStat">Pending</span></div>
    <div class="stat warn"><span class="stat-num" id="statOverdue">0</span><span class="stat-label" data-i18n="overdueStat">Overdue</span></div>
    <div class="stat today"><span class="stat-num" id="statDueToday">0</span><span class="stat-label" data-i18n="dueTodayStat">Due today</span></div>
    <div class="stat"><span class="stat-num" id="statPct">0%</span><span class="stat-label" data-i18n="completed">Completed</span></div>
  </section>

  <section class="card">
    <h2 data-i18n="addTask">Add task</h2>
    <p id="editBanner" class="edit-banner" style="display:none"></p>
    <form id="taskForm" novalidate>
      <label><span data-i18n="title">Title</span>
        <input id="titleInput" type="text" maxlength="100" data-i18n-ph="titlePh" placeholder="e.g. Buy notebooks" required>
      </label>
      <label><span data-i18n="note">Note (optional)</span>
        <textarea id="noteInput" rows="2" maxlength="500" data-i18n-ph="notePh" placeholder="Details, links, reminders..."></textarea>
      </label>
      <div class="row3">
        <label><span data-i18n="priority">Priority</span>
          <select id="priorityInput">
            <option value="high" data-i18n="high">High</option>
            <option value="medium" data-i18n="medium" selected>Medium</option>
            <option value="low" data-i18n="low">Low</option>
          </select>
        </label>
        <label><span data-i18n="category">Category</span>
          <input id="categoryInput" type="text" maxlength="30" data-i18n-ph="categoryPh" placeholder="e.g. Study, Home">
        </label>
        <label><span data-i18n="dueDate">Due date</span>
          <input id="dueInput" type="date">
        </label>
      </div>
      <p id="formError" class="form-error" role="alert"></p>
      <div class="form-actions">
        <button type="submit" class="primary" data-i18n="save">Save task</button>
        <button type="button" id="cancelEditBtn" style="display:none" data-i18n="cancelEdit">Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="chips" role="tablist" aria-label="Filter by status">
      <button type="button" class="chip active" data-status-chip="all" data-i18n="all">All</button>
      <button type="button" class="chip" data-status-chip="pending" data-i18n="pending">Pending</button>
      <button type="button" class="chip" data-status-chip="done" data-i18n="done">Done</button>
      <button type="button" class="chip" data-status-chip="overdue" data-i18n="overdue">Overdue</button>
      <button type="button" class="chip" data-status-chip="due-today" data-i18n="dueToday">Due today</button>
    </div>
    <div class="filters">
      <input id="searchInput" type="search" data-i18n-ph="searchPh" placeholder="Search tasks..." aria-label="Search tasks">
      <label><span data-i18n="priority">Priority</span>
        <select id="filterPriority">
          <option value="all" data-i18n="all">All</option>
          <option value="high" data-i18n="high">High</option>
          <option value="medium" data-i18n="medium">Medium</option>
          <option value="low" data-i18n="low">Low</option>
        </select>
      </label>
      <label><span data-i18n="category">Category</span>
        <select id="filterCategory"><option value="all" data-i18n="all">All</option></select>
      </label>
      <label><span data-i18n="sortBy">Sort by</span>
        <select id="sortSelect">
          <option value="due" data-i18n="sortDue">Due date</option>
          <option value="priority" data-i18n="sortPriority">Priority</option>
          <option value="created" data-i18n="sortCreated">Newest</option>
        </select>
      </label>
    </div>
    <p id="emptyState" class="empty" style="display:none"></p>
    <ul id="taskList" class="task-list"></ul>
  </section>

  <section class="card">
    <h2>Data</h2>
    <div class="form-actions">
      <button type="button" id="exportBtn" data-i18n="export">Export JSON</button>
      <button type="button" id="importBtn" data-i18n="import">Import JSON</button>
      <button type="button" id="eraseBtn" class="danger" data-i18n="erase">Erase all data</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <p id="dataMsg" class="msg"></p>
  </section>
</main>

<footer class="wrap">
  <p data-i18n="footer">Offline personal tool. Your tasks stay in this browser (localStorage). No account, no server.</p>
</footer>

<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
